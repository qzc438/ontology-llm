# The web interface and the database it needs.
#
#   docker compose up --build      then open http://127.0.0.1:5000
#
# Put the API keys in a .env file beside this one, the same file the README
# already asks for. It is read by compose and passed to the container; it is
# never copied into the image.

services:
  db:
    # the stock postgres image plus pgvector, which the pipeline needs for the
    # embedding columns. om_csv_to_database.py runs CREATE EXTENSION itself, so
    # nothing has to be set up by hand.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ontology
    volumes:
      - db-data:/var/lib/postgresql/data
      # runs only when the data directory is first created
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      # the web container waits for this, so the first run does not arrive
      # before the database is accepting connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontology"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    # Ollama is not built into the web image. Compose fetches the official one
    # when the stack first starts, so the container always has an Ollama it can
    # reach, without the host's own having to accept outside connections.
    #
    # Pinned, like the database image above. On `latest` this container quietly
    # moved to a version that refuses to embed with a chat model, while the
    # Ollama on the host stayed where it was, and the same settings then behaved
    # differently in the two places. Raise it deliberately, not by restarting.
    image: ollama/ollama:0.33.2
    volumes:
      # A store of its own, so a pull here cannot disturb the models the host's
      # Ollama is using, and no permission has to be shared with it. The models
      # survive docker compose down; only down -v discards them.
      - ollama-models:/root/.ollama
    # Uncomment to hand Ollama the GPU. This needs the NVIDIA container toolkit
    # on the host: install it first, or the stack will refuse to start. Without
    # it Ollama runs on the CPU, which works but is slow for the larger models.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      # the web container waits for this, so the models list on the page is
      # asked for only once Ollama is answering
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # The image already runs as uid 1000. If your account is a different id,
    # start it with DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose up,
    # so uploads and results on the host belong to you and not to root.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      # /app belongs to group 0 in the image, and the pipeline writes files into
      # it directly. Carrying that group means any user id above can write there,
      # while what lands in the mounted folders still belongs to that id on the
      # host, which is the point of setting it.
      - "0"
    environment:
      # run_config.py names 127.0.0.1, which inside a container is the container
      # itself. This points the pipeline at the database service instead, and is
      # applied by web_overrides.py without run_config.py being touched.
      ONTOLOGY_DB_URL: postgresql://postgres:postgres@db:5432/ontology
      # The open models run on the ollama service above, which is reachable
      # without anything being configured on the host. To use the Ollama already
      # installed on this machine instead, which is worth doing when it has the
      # GPU and the models, start with
      #   OLLAMA_URL=http://host.docker.internal:11434 docker compose up
      # and make sure it listens on more than 127.0.0.1, or the container will
      # resolve the name and then reach nothing. See DOCKER.md, open models.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_HOST: ${OLLAMA_URL:-http://ollama:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # Docker Desktop defines this name already; on Linux it has to be asked for
      - "host.docker.internal:host-gateway"
    ports:
      # Bound to the loopback address: the interface has no authentication and
      # accepts API keys, so it should not be offered to the network. Set
      # WEB_PORT to publish somewhere other than 5000, which is useful when a
      # copy is already running outside Docker.
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    volumes:
      # uploads and results live on the host, so they outlive the container and
      # can be opened without going through the interface
      - ./data/uploads:/app/data/uploads
      - ./alignment/uploads:/app/alignment/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  ollama-models:
