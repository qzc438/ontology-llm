# The web interface and the database it needs.
#
#   docker compose up --build      then open http://127.0.0.1:5000
#
# Put the API keys in a .env file beside this one, the same file the README
# already asks for. It is read by compose and passed to the container; it is
# never copied into the image.

services:
  db:
    # the stock postgres image plus pgvector, which the pipeline needs for the
    # embedding columns. om_csv_to_database.py runs CREATE EXTENSION itself, so
    # nothing has to be set up by hand.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ontology
    volumes:
      - db-data:/var/lib/postgresql/data
      # runs only when the data directory is first created
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      # the web container waits for this, so the first run does not arrive
      # before the database is accepting connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontology"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # The image already runs as uid 1000. If your account is a different id,
    # start it with DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose up,
    # so uploads and results on the host belong to you and not to root.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      # run_config.py names 127.0.0.1, which inside a container is the container
      # itself. This points the pipeline at the database service instead, and is
      # applied by web_overrides.py without run_config.py being touched.
      ONTOLOGY_DB_URL: postgresql://postgres:postgres@db:5432/ontology
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # Bound to the loopback address: the interface has no authentication and
      # accepts API keys, so it should not be offered to the network. Set
      # WEB_PORT to publish somewhere other than 5000, which is useful when a
      # copy is already running outside Docker.
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    volumes:
      # uploads and results live on the host, so they outlive the container and
      # can be opened without going through the interface
      - ./data/uploads:/app/data/uploads
      - ./alignment/uploads:/app/alignment/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
